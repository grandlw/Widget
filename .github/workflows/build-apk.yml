name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "GrandlRankWidget.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q GrandlRankWidget.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/GrandlRankWidget
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrandlRankWidget-APK
          path: build-src/GrandlRankWidget/app/build/outputs/apk/debug/app-debug.apk
